<!DOCTYPE html>
<html lang="{{t:app.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} - Admin Panel - {{t:app.name}}</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/base/typography.css">
    
    <!-- Components -->
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/modals.css">
    <link rel="stylesheet" href="/css/components/notifications.css">
    
    <!-- Layout -->
    <link rel="stylesheet" href="/css/layout/sidebar.css">
    <link rel="stylesheet" href="/css/layout/topbar.css">
    
    <!-- Admin Specific -->
    <link rel="stylesheet" href="/css/pages/admin.css">
    
    <!-- Utilities -->
    <link rel="stylesheet" href="/css/utilities/spacing.css">
    
    <!-- Icons -->
    <link rel="stylesheet" href="/css/icons.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" rel="stylesheet">
    {{EXTRA_HEAD}}
</head>
<body class="admin-body">
    <!-- Animated Background -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- Admin Sidebar -->
    <aside class="sidebar admin-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" stroke="url(#gradient)" stroke-width="2"/>
                    <circle cx="20" cy="20" r="4" fill="url(#gradient)"/>
                    <path d="M20 2 L20 10" stroke="url(#gradient)" stroke-width="2"/>
                    <path d="M20 30 L20 38" stroke="url(#gradient)" stroke-width="2"/>
                    <path d="M2 20 L10 20" stroke="url(#gradient)" stroke-width="2"/>
                    <path d="M30 20 L38 20" stroke="url(#gradient)" stroke-width="2"/>
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">ADMIN</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <!-- Admin Section -->
            <div class="nav-section">
                <div class="nav-section-title">Admin Panel</div>
                <a href="/panel/admin" class="nav-item {{ACTIVE_ADMIN_DASHBOARD}}">
                    <span class="nav-icon">
                        <i class="ph-bold ph-gauge"></i>
                    </span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="/panel/admin/users" class="nav-item {{ACTIVE_ADMIN_USERS}}">
                    <span class="nav-icon">
                        <i class="ph-bold ph-users"></i>
                    </span>
                    <span class="nav-label">Users</span>
                </a>
                <a href="/panel/admin/logs" class="nav-item {{ACTIVE_ADMIN_LOGS}}">
                    <span class="nav-icon">
                        <i class="ph-bold ph-file-text"></i>
                    </span>
                    <span class="nav-label">System Logs</span>
                </a>
            </div>

            <!-- User Panel Section -->
            <div class="nav-section">
                <div class="nav-section-title">User Panel</div>
                <a href="/panel/dashboard" class="nav-item">
                    <span class="nav-icon">
                        <i class="ph-bold ph-house"></i>
                    </span>
                    <span class="nav-label">{{t:nav.dashboard}}</span>
                </a>
                <a href="/panel/accounts" class="nav-item">
                    <span class="nav-icon">
                        <i class="ph-bold ph-game-controller"></i>
                    </span>
                    <span class="nav-label">{{t:nav.accounts}}</span>
                </a>
                <a href="/panel/proxies" class="nav-item">
                    <span class="nav-icon">
                        <i class="ph-bold ph-globe"></i>
                    </span>
                    <span class="nav-label">{{t:nav.proxies}}</span>
                </a>
                <a href="/panel/tasks" class="nav-item">
                    <span class="nav-icon">
                        <i class="ph-bold ph-robot"></i>
                    </span>
                    <span class="nav-label">{{t:nav.tasks}}</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info admin-user-info">
                <div class="user-avatar admin-avatar">
                    <i class="ph-bold ph-shield-check"></i>
                </div>
                <div class="user-details">
                    <div class="user-role">ADMIN</div>
                    <div class="user-email" id="sidebarUserEmail">{{t:sidebar.loading}}</div>
                </div>
            </div>
            
            <!-- Language Switcher -->
            <div class="sidebar-language-switcher">
                <button class="sidebar-lang-btn" data-lang="tr" title="Türkçe">
                    <span class="flag-icon">🇹🇷</span>
                    <span class="lang-label">Türkçe</span>
                </button>
                <button class="sidebar-lang-btn" data-lang="en" title="English">
                    <span class="flag-icon">🇬🇧</span>
                    <span class="lang-label">English</span>
                </button>
            </div>
            
            <!-- Logout Button -->
            <button class="sidebar-logout-btn" id="sidebarLogoutBtn">
                <i class="ph-bold ph-sign-out"></i>
                <span class="logout-label">{{t:topbar.logout}}</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content admin-main-content">
        <!-- Top Bar -->
        <header class="topbar admin-topbar">
            <div class="topbar-left">
                <div class="admin-badge">
                    <i class="ph-bold ph-shield-check"></i>
                    <span>ADMIN PANEL</span>
                </div>
                <h1 class="page-title">{{PAGE_TITLE}}</h1>
            </div>
            <div class="topbar-right">
                <div class="admin-quick-stats" id="adminQuickStats">
                    <div class="quick-stat">
                        <i class="ph-bold ph-users"></i>
                        <span id="quickStatUsers">-</span>
                    </div>
                    <div class="quick-stat">
                        <i class="ph-bold ph-activity"></i>
                        <span id="quickStatTasks">-</span>
                    </div>
                </div>
                <button class="topbar-btn" id="notificationBtn">
                    <i class="ph-bold ph-bell"></i>
                    <span class="badge">0</span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area admin-content-area">
            {{CONTENT}}
        </div>
    </main>

    <!-- Notification Container -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/icons.js"></script>
    {{EXTRA_SCRIPTS}}
</body>
</html>
